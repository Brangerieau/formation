name: formation-forum

services:
  app:
    build:
      context: ./
      dockerfile: ./docker/app/Dockerfile
    container_name: formation-forum-app
    volumes:
      - .:/app
    # 8080 and 8081 are taken by backend.psn-trophy.
    ports:
      - "8090:8080"

  # CPU only: no GPU is exposed to Docker on this machine.
  ollama:
    image: ollama/ollama:0.40.6
    container_name: formation-forum-ollama
    environment:
      # Default is 5 min: reloading the model from disk adds ~7 s to the first message after a pause.
      OLLAMA_KEEP_ALIVE: 1h
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: formation-forum-qdrant
    volumes:
      - qdrant:/qdrant/storage
    # Dashboard: http://localhost:6333/dashboard
    ports:
      - "6333:6333"

volumes:
  ollama:
  qdrant:
