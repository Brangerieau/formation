nelmio_api_doc:
    documentation:
        info:
            title: Formation Forum API
            description: Catégories, sujets et messages du forum.
            version: 1.0.0
    areas: # to filter documented areas
        path_patterns:
            - ^/api(?!/doc$) # Accepts routes under /api except /api/doc
    models:
        names:
            - { alias: TopicWithPosts, type: App\Entity\Topic, groups: [topic, 'topic:posts', post] }
